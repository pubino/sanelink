<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeLink URL Decoder</title>
  <meta name="description" content="Securely decode Microsoft SafeLink URLs locally in your browser. Complete privacy with zero network calls.">
  
  <!-- Paper Tiger design system styles -->
  <link rel="stylesheet" href="tokens/tokens.css" />
  <link rel="stylesheet" href="https://use.typekit.net/mxl1ncs.css" />
  <link rel="stylesheet" href="tokens/fonts.css" />
  <link rel="stylesheet" href="components/buttons.css" />
  <link rel="stylesheet" href="components/forms.css" />
  
  <!-- Custom page styling -->
  <link rel="stylesheet" href="style.css" />
  
  <link rel="icon" href="assets/logos/favicon.ico" />
</head>
<body>

  <div class="centered-layout">
    <!-- Standalone Decrypter Card -->
    <main class="decoder-card">
      <header class="decoder-header">
        <h1 class="decoder-title">SafeLink URL Decoder</h1>
      </header>

      <div class="pt-form">
        <div class="pt-field">
          <label class="pt-field__label" for="safelink-input">Enter SafeLink URL</label>
          <textarea
            class="pt-textarea"
            id="safelink-input"
            placeholder="Paste your SafeLink URL here (e.g., https://can01.safelinks.protection.outlook.com/?url=...)"
            rows="6"
          ></textarea>
        </div>
        
        <div class="pt-form__actions" style="border: none; padding-top: 0; margin-top: var(--space-2); flex-direction: column; align-items: center; gap: var(--space-2);">
          <button id="decode-btn" class="pt-btn pt-btn--primary pt-btn--round-corners decode-button" style="width: 100%;">
            Decode URL &nbsp;→
          </button>
          <small class="pt-field__hint" style="text-align: center; display: block; margin-top: var(--space-2); width: 100%;">All decoding happens in-browser.</small>
        </div>
      </div>

      <!-- Result Area -->
      <div id="result-section" class="result-area hidden">
        <div class="result-card-header">
          <h2 class="result-title">Decoded Destination</h2>
          <button id="copy-btn" class="pt-btn pt-btn--secondary pt-btn--round-corners copy-button" title="Copy to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="copy-icon">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy</span>
          </button>
        </div>
        <div class="result-content-box">
          <a id="decoded-url" href="#" target="_blank" rel="noopener noreferrer"></a>
        </div>
      </div>

      <!-- Error Area -->
      <div id="error-section" class="error-area hidden">
        <div class="error-header">
          <span class="error-icon">⚠️</span>
          <h2 class="error-title">Decoding Error</h2>
        </div>
        <p id="error-message"></p>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="script.js"></script>
</body>
</html>
